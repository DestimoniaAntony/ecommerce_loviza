<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - 500</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .error-container {
            max-width: 500px;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            border: 1px solid #eaeaea;
        }
        h1 {
            font-size: 80px;
            margin: 0;
            color: #dc2626;
            font-weight: 800;
            line-height: 1;
        }
        h2 {
            font-size: 24px;
            margin: 16px 0 8px 0;
            color: #4b5563;
        }
        p {
            color: #6b7280;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            background-color: #1f2937;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s ease;
        }
        a:hover {
            background-color: #374151;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Oops, something went wrong on our end. Our team has been notified and we are working to fix it.</p>
        <a href="javascript:history.back()">Go Back</a>
    </div>
</body>
</html>
