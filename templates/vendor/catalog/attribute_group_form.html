{% extends 'base/vendor_base.html' %}
{% load static %}

{% block title %}Edit Attribute Group — CommerceHub{% endblock %}

{% block content %}
<div class="breadcrumb">
    <a href="{% url 'commercehub_app:dashboard' %}">Dashboard</a>
    <span class="breadcrumb-sep">›</span>
    <a href="{% url 'catalog:attribute_list' %}">Attributes &amp; Specifications</a>
    <span class="breadcrumb-sep">›</span>
    <span>Edit Attribute Group</span>
</div>

<div class="data-card" style="max-width: 550px; padding: 28px;">
    <form method="post">
        {% csrf_token %}

        <div class="form-section">
            <h3 class="form-section-title">Attribute Group Details</h3>
            
            <div class="form-group">
                <label class="form-label" for="name">Group Name <span class="req">*</span></label>
                <input type="text" id="name" name="name" class="form-input" placeholder="e.g. Dimensions, Display Specs" 
                       value="{{ group.name }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" name="description" class="form-input" rows="3" placeholder="Describe the purpose of this group...">{{ group.description }}</textarea>
            </div>
        </div>

        <div class="form-actions" style="margin-top: 32px;">
            <button type="submit" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                </svg>
                Save Group
            </button>
            <a href="{% url 'catalog:attribute_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
